<!DOCTYPE html>
<html>
<head>
    <title>My Blog - Posts</title>
</head>
<body>
    <h1>Blog Posts</h1>
    <ul>
        {% for post in posts %}
            <li>
                <a href="{% url 'post_detail' post.pk %}">{{ post.title }}</a>
                ({{ post.published_date }})
            </li>
        {% endfor %}
    </ul>
</body>
</html>
